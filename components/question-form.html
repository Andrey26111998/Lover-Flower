<form action="#" class="form question-form" id="question-form">
    <div class="question-form__text">Отправьте ваш вопрос, заказ, предложение или жалобу через форму обратной связи, и
        наш специалист свяжется с вами в течение 15 минут.
    </div>
    <div class="question-form__inputs">
        <div class="form-block question-form__input">
            <div class="input-wrapper">
                <input class="input" id="question-name" name="name" placeholder="Ваше имя" required type="text">
            </div>
        </div>
        <div class="form-block question-form__input">
            <div class="input-wrapper">
                <input class="input" id="question-phone" name="phone" placeholder="+7 (977) 777-77-77" required
                       type="tel">
            </div>
        </div>
        <div class="form-block question-form__input">
            <div class="input-wrapper">
                <textarea class="input" id="question-message" name="question" placeholder="Ваш комментарий"
                          required></textarea>
            </div>
        </div>
    </div>
    <button class="button button-question question-form__button">отправить</button>
    <div class="form__info question-form__info">Нажимая на кнопку «Отправить», я даю свое согласие на обработку
        персональных данных, в соответствии с <a href="">Политикой конфиденциальности</a></div>
</form>
